# GitLab CI — cloud-hermes-management
# Test tren moi nhanh/MR; build + release khi push tag v* / Tests on branches & MRs; build+release on v* tags
# (khong build artifact o may ca nhan / never build release artifacts locally)

image: python:3.11-slim

stages:
  - test
  - build
  - release

# Cong cho release: test phai xanh truoc / release gate — tests must pass first
# Chay tren tag luon de dam bao gate / also runs on tag pipelines so the gate covers releases
test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    # Dep cho ca hai bo test / deps for both suites (rag-mcp: fastembed/mcp la lazy import, khong can)
    - pip install fastapi uvicorn pydantic pydantic-settings bcrypt psutil pyyaml httpx pytest numpy pypdf
    - pip install -e rag-mcp --no-deps
    - pip install -e management-api
    # Ca hai bo pytest phai xanh / both pytest suites must pass
    - python -m pytest management-api/tests rag-mcp/tests -q

# Build wheel + sdist, chi khi co tag v* / build wheels + sdists, only on v* tags
build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - pip install build
    - python -m build management-api/
    - python -m build rag-mcp/
    - mkdir -p dist
    - cp management-api/dist/* rag-mcp/dist/* dist/
    # SHA256SUMS.txt voi ten file ngan / checksums with bare filenames
    - (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
    # Ghi ten file vao dotenv de job release tao link chinh xac / record artifact filenames for the release job links
    - |
      {
        mgmt_whl=$(ls dist/*.whl | grep -v rag | head -n1)
        mgmt_sdist=$(ls dist/*.tar.gz | grep -v rag | head -n1)
        rag_whl=$(ls dist/*.whl | grep rag | head -n1)
        rag_sdist=$(ls dist/*.tar.gz | grep rag | head -n1)
        echo "ASSET_MGMT_WHL=${mgmt_whl##*/}"
        echo "ASSET_MGMT_SDIST=${mgmt_sdist##*/}"
        echo "ASSET_RAG_WHL=${rag_whl##*/}"
        echo "ASSET_RAG_SDIST=${rag_sdist##*/}"
      } > build.env
      cat build.env
    - ls -l dist/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
    reports:
      dotenv: build.env

# Tao GitLab Release khi co tag v* / create the GitLab Release on v* tags
# Khong dung keyword `release:` — runner 19.6+ yeu cau glab/release-cli trong
# image job (python:3.11-slim khong co) va embed mo ta markdown vao shell script
# (backtick trong mo ta bi thuc thi). Goi Releases API truc tiep qua
# .ci/create_gitlab_release.py — xem docstring file do.
# Not using the `release:` keyword — runner 19.6+ needs glab/release-cli inside
# the job image (python:3.11-slim has neither) and embeds the markdown notes
# into shell code (backticks get executed). We call the Releases API directly
# via .ci/create_gitlab_release.py — see that file's docstring.
release:
  stage: release
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - ls -l dist/
    - python -u .ci/create_gitlab_release.py
  # Upload lai dist/ de link job-artifact $CI_JOB_ID hoat dong; giu ca khi that
  # bai de doc release-response.json / re-upload dist/ so $CI_JOB_ID artifact
  # links resolve; keep even on failure so release-response.json stays readable
  artifacts:
    when: always
    paths:
      - dist/
      - release-response.json
    expire_in: 30 days
