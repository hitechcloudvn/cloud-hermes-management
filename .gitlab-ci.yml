# GitLab CI — cloud-hermes-management
# Test trên mọi nhánh/MR; build + release khi push tag v* / Tests on branches & MRs; build+release on v* tags
# (không build artifact ở máy cá nhân / never build release artifacts locally)

image: python:3.11-slim

stages:
  - test
  - build
  - release

# Cổng cho release: test phải xanh trước / release gate — tests must pass first
# Chạy trên tag luôn để đảm bảo gate / also runs on tag pipelines so the gate covers releases
test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    # Dep cho cả hai bộ test / deps for both suites (rag-mcp: fastembed/mcp là lazy import, không cần)
    - pip install fastapi uvicorn pydantic pydantic-settings bcrypt psutil pyyaml httpx pytest numpy pypdf
    - pip install -e rag-mcp --no-deps
    - pip install -e management-api
    # Cả hai bộ pytest phải xanh / both pytest suites must pass
    - python -m pytest management-api/tests rag-mcp/tests -q

# Build wheel + sdist, chỉ khi có tag v* / build wheels + sdists, only on v* tags
build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - pip install build
    - python -m build management-api/
    - python -m build rag-mcp/
    - mkdir -p dist
    - cp management-api/dist/* rag-mcp/dist/* dist/
    # SHA256SUMS.txt với tên file ngắn / checksums with bare filenames
    - (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
    # Ghi tên file vào dotenv để job release tạo link chính xác / record artifact filenames for the release job links
    - |
      {
        mgmt_whl=$(ls dist/*.whl | grep -v rag | head -n1)
        mgmt_sdist=$(ls dist/*.tar.gz | grep -v rag | head -n1)
        rag_whl=$(ls dist/*.whl | grep rag | head -n1)
        rag_sdist=$(ls dist/*.tar.gz | grep rag | head -n1)
        echo "ASSET_MGMT_WHL=${mgmt_whl##*/}"
        echo "ASSET_MGMT_SDIST=${mgmt_sdist##*/}"
        echo "ASSET_RAG_WHL=${rag_whl##*/}"
        echo "ASSET_RAG_SDIST=${rag_sdist##*/}"
      } > build.env
      cat build.env
    - ls -l dist/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
    reports:
      dotenv: build.env

# Tạo GitLab Release khi có tag v* / create the GitLab Release on v* tags
release:
  stage: release
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  # Upload lại dist/ để link job-artifact $CI_JOB_ID hoạt động / re-upload dist/ so $CI_JOB_ID artifact links resolve
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    description: |
      ## Tiếng Việt

      Bản phát hành đầu tiên của **cloud-hermes-management** — bộ công cụ triển khai Hermes Agent lên VPS bare-metal (Ubuntu 24.04):

      - **Management API** (FastAPI) với 73 endpoint quản trị
      - **RAG MCP** — dịch vụ truy xuất tri thức cục bộ
      - **Trình cài đặt bare-metal** (`install.sh` / `bootstrap.sh`)
      - Wheel/sdist do CI xây dựng, kèm checksum `SHA256SUMS.txt`

      Cài đặt bằng lệnh sau từ tổ chức `hitechcloudvn`:

      ```bash
      curl -fsSL https://raw.githubusercontent.com/hitechcloudvn/cloud-hermes-management/main/install.sh | bash
      ```

      ## English

      First release of **cloud-hermes-management** — bare-metal deployment wrapper for Hermes Agent (Ubuntu 24.04 VPS):

      - **Management API** (FastAPI) with 73 endpoints
      - **RAG MCP** — local knowledge retrieval service
      - **Bare-metal installer** (`install.sh` / `bootstrap.sh`)
      - CI/CD-built wheels/sdists with `SHA256SUMS.txt` checksums

      Install with the following command from the `hitechcloudvn` org:

      ```bash
      curl -fsSL https://raw.githubusercontent.com/hitechcloudvn/cloud-hermes-management/main/install.sh | bash
      ```
    assets:
      links:
        # Tên file lấy từ dotenv của job build / filenames discovered by the build job
        - name: "hermes_mgmt wheel"
          url: "$CI_PROJECT_URL/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${ASSET_MGMT_WHL}"
          link_type: package
        - name: "hermes_mgmt sdist"
          url: "$CI_PROJECT_URL/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${ASSET_MGMT_SDIST}"
          link_type: package
        - name: "hermes_rag wheel"
          url: "$CI_PROJECT_URL/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${ASSET_RAG_WHL}"
          link_type: package
        - name: "hermes_rag sdist"
          url: "$CI_PROJECT_URL/-/jobs/${CI_JOB_ID}/artifacts/file/dist/${ASSET_RAG_SDIST}"
          link_type: package
        - name: "SHA256SUMS.txt"
          url: "$CI_PROJECT_URL/-/jobs/${CI_JOB_ID}/artifacts/file/dist/SHA256SUMS.txt"
          link_type: other
