# Release — cloud-hermes-management
# Push tag v* de CI tu test, build wheels/sdists, checksum va publish GitHub Release
# Pushing a v* tag makes CI run tests, build wheels/sdists, checksum them and publish the GitHub Release
# (khong build artifact o may ca nhan / never build release artifacts locally)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cong cho release: test phai xanh truoc / release gate — tests must pass first
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            management-api/pyproject.toml
            rag-mcp/pyproject.toml

      # Dep cho ca hai bo test / deps for both suites (rag-mcp: fastembed/mcp la lazy import, khong can)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings bcrypt psutil pyyaml httpx pytest numpy pypdf
          pip install -e rag-mcp --no-deps
          pip install -e management-api

      # Ca hai bo pytest phai xanh / both pytest suites must pass
      - name: Run pytest (management-api + rag-mcp)
        run: python -m pytest management-api/tests rag-mcp/tests -q

  build-release:
    name: build artifacts + GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build wheel + sdist cho ca hai goi / build wheels + sdists for both packages
      - name: Build wheels and sdists
        run: |
          pip install build
          python -m build management-api
          python -m build rag-mcp
          mkdir -p artifacts
          cp management-api/dist/* rag-mcp/dist/* artifacts/
          (cd artifacts && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          ls -l artifacts

      # Luu artifact tren workflow de truy vet / upload workflow artifacts for traceability
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      # Tao GitHub Release tren tag da push / create the GitHub Release on the pushed tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## Tiếng Việt

            Bản phát hành đầu tiên của **cloud-hermes-management** — bộ công cụ triển khai Hermes Agent lên VPS bare-metal (Ubuntu 24.04):

            - **Management API** (FastAPI) với 73 endpoint quản trị
            - **RAG MCP** — dịch vụ truy xuất tri thức cục bộ
            - **Trình cài đặt bare-metal** (`install.sh` / `bootstrap.sh`)
            - Wheel/sdist do CI xây dựng, kèm checksum `SHA256SUMS.txt`

            Cài đặt bằng lệnh sau từ tổ chức `hitechcloudvn`:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/hitechcloudvn/cloud-hermes-management/main/install.sh | bash
            ```

            ## English

            First release of **cloud-hermes-management** — bare-metal deployment wrapper for Hermes Agent (Ubuntu 24.04 VPS):

            - **Management API** (FastAPI) with 73 endpoints
            - **RAG MCP** — local knowledge retrieval service
            - **Bare-metal installer** (`install.sh` / `bootstrap.sh`)
            - CI/CD-built wheels/sdists with `SHA256SUMS.txt` checksums

            Install with the following command from the `hitechcloudvn` org:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/hitechcloudvn/cloud-hermes-management/main/install.sh | bash
            ```
