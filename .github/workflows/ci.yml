# CI — cloud-hermes-management
# Kiểm tra shell + chạy test suite mỗi push/PR vào main / Shell checks + test suites on every push/PR to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hủy run cũ khi có run mới cùng ref / Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    name: shell-lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bash -n: chặn lỗi cú pháp, blocking / blocking syntax check on the shell scripts
      - name: bash -n syntax check
        run: |
          bash -n install.sh
          bash -n bootstrap.sh
          bash -n scripts/upgrade-mgmt.sh
          bash -n scripts/test-mgmt-api.sh

      # shellcheck: chỉ cảnh báo, không chặn (advisory) / advisory only — install.sh is large
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bootstrap.sh scripts/upgrade-mgmt.sh scripts/test-mgmt-api.sh

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            management-api/pyproject.toml
            rag-mcp/pyproject.toml

      # Dep cho rag-mcp (numpy/pypdf); fastembed/mcp là lazy import, không cần
      # rag-mcp deps (numpy/pypdf); fastembed/mcp are lazy imports, not needed
      - name: Install rag-mcp test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pypdf
          pip install -e rag-mcp --no-deps

      # rag-mcp pytest trên mọi phiên bản Python / rag-mcp pytest on every Python version
      - name: Run pytest (rag-mcp)
        working-directory: rag-mcp
        run: python -m pytest -q

      # management-api yêu cầu Python >= 3.11 / management-api requires Python >= 3.11
      - name: Install management-api test dependencies
        if: matrix.python-version != '3.10'
        run: |
          pip install fastapi uvicorn pydantic pydantic-settings bcrypt psutil pyyaml httpx
          pip install -e management-api

      # management-api pytest phải xanh / management-api pytest must pass
      - name: Run pytest (management-api)
        if: matrix.python-version != '3.10'
        run: python -m pytest management-api/tests -q
