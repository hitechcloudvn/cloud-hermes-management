# CI — cloud-hermes-management
# Kiem tra shell + chay test suite moi push/PR vao main / Shell checks + test suites on every push/PR to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Huy run cu khi co run moi cung ref / Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-lint:
    name: shell-lint (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bash -n: chan loi cu phap, blocking / blocking syntax check on the 4 shell scripts
      - name: bash -n syntax check
        run: |
          bash -n install.sh
          bash -n bootstrap.sh
          bash -n scripts/upgrade-mgmt.sh
          bash -n scripts/test-mgmt-api.sh

      # shellcheck: chi canh bao, khong chan (advisory) / advisory only — install.sh is large
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bootstrap.sh scripts/upgrade-mgmt.sh scripts/test-mgmt-api.sh

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            management-api/pyproject.toml
            rag-mcp/pyproject.toml

      # Dep cho ca hai bo test / deps for both suites (rag-mcp: fastembed/mcp la lazy import, khong can)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings bcrypt psutil pyyaml httpx pytest numpy pypdf
          pip install -e rag-mcp --no-deps
          pip install -e management-api

      # Ca hai bo pytest phai xanh / both pytest suites must pass
      - name: Run pytest (management-api + rag-mcp)
        run: python -m pytest management-api/tests rag-mcp/tests -q
